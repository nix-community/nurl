[package]
name = "nurl"
version = "0.4.1"
authors = ["figsoda <figsoda@pm.me>"]
edition = "2024"
description = "Generate Nix fetcher calls from repository URLs"
readme = "README.md"
homepage = "https://github.com/nix-community/nurl"
repository = "https://github.com/nix-community/nurl"
license = "MPL-2.0"
keywords = ["cli", "fetch", "git", "nix", "prefetch"]
categories = ["command-line-utilities"]

[dependencies]
bstr = "1.13.1"
color-eyre = "0.6.5"
enum_dispatch = "0.3.13"
eyre = "0.6.14"
gix-url = "0.37.0"
itertools = "0.15.0"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
supports-color = "3.0.2"
ureq = { version = "3.4.0", features = ["json"] }

[dependencies.clap]
version = "4.6.6"
features = ["cargo", "derive", "unicode", "wrap_help"]

[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"

[dev-dependencies]
assert_cmd = "2.2.2"
nu-glob = "0.115.0"
trycmd = "1.2.1"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
